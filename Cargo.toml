[package]
name = "base_backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Reusable GraphQL backend boilerplate (users, email, notifications, i18n) built on Axum + async-graphql + Postgres"
license = "MIT"

# The crate is both a reusable library (import `base_backend` in other projects)
# and a runnable binary (`cargo run --bin server`).
[lib]
name = "base_backend"
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
# Async runtime + HTTP
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws", "macros"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }

# GraphQL (queries, mutations AND subscriptions)
async-graphql = { version = "7", features = ["chrono", "uuid"] }
async-graphql-axum = "7"
async-trait = "0.1"

# Database
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "macros",
    "migrate",
] }

# Auth / crypto
jsonwebtoken = "9"
argon2 = { version = "0.5", features = ["std"] }
rand = "0.8"

# Email
lettre = { version = "0.11", default-features = false, features = [
    "tokio1-rustls-tls",
    "smtp-transport",
    "builder",
    "hostname",
] }

# Firebase / HTTP client (token verification, FCM)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Serialization / config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Misc
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
