# Example configuration for the base backend.
# Copy this file to env.yaml and fill in real values (env.yaml is gitignored).
#
# Every value can be overridden with an environment variable named after the
# nested keys, upper-cased and joined with `__` (double underscore), e.g.
#   database.url            -> DATABASE__URL
#   jwt.secret              -> JWT__SECRET
#   email.smtp_password     -> EMAIL__SMTP_PASSWORD
# See `src/config.rs` (Config::apply_env_overrides).

server:
  host: "0.0.0.0"
  port: 8080

database:
  # Postgres is the chosen database (see README "Why Postgres").
  url: "postgres://user:password@localhost:5432/base_backend"
  max_connections: 10
  run_migrations: true

jwt:
  secret: "change-me"
  issuer: "base_rust_backend"
  access_ttl_minutes: 30
  refresh_ttl_days: 30

email:
  smtp_host: "smtp.example.com"
  smtp_port: 465
  smtp_user: "smtp-user"
  smtp_password: "smtp-password"
  smtp_tls: true          # STARTTLS/implicit TLS; false for a local dev relay (e.g. MailHog)
  from_address: "noreply@example.com"
  from_name: "Saobraćaj"
  # If true, register() does NOT issue tokens until the email code is confirmed.
  confirm_email_before_auth: true
  worker_interval_secs: 5

firebase:
  # Public Web API key. Used to verify client Firebase ID tokens on social
  # login (Identity Toolkit REST). Not a secret.
  # Firebase Console -> Project settings -> General -> "Web API Key".
  api_key: ""
  # Firebase Admin SDK service-account credentials, as the FULL JSON of the
  # downloaded key file. Required ONLY to send push notifications (FCM HTTP v1);
  # ID-token verification above does not need it. project_id is read from this
  # JSON, so there is no separate project_id field.
  #
  # This IS a secret: prefer the FIREBASE__SERVICE_ACCOUNT_JSON env var (paste the
  # JSON as its value) over committing it here. Download it from
  # Firebase Console -> Project settings -> Service accounts ->
  # "Generate new private key".
  #
  # If you do inline it in YAML, use a block scalar, e.g.:
  #   service_account_json: |
  #     {
  #       "type": "service_account",
  #       "project_id": "your-project",
  #       ...
  #     }
  service_account_json: ""

notifications:
  worker_interval_secs: 10

i18n:
  default_language: "en"
  supported: ["en", "ru", "sr"]
