# Default configuration for the base backend.
#
# Every value can be overridden with an environment variable named after the
# nested keys, upper-cased and joined with `__` (double underscore), e.g.
#   database.url            -> DATABASE__URL
#   jwt.secret              -> JWT__SECRET
#   email.smtp_password     -> EMAIL__SMTP_PASSWORD
# See `src/config.rs` (Config::apply_env_overrides).

server:
  host: "0.0.0.0"
  port: 8080

database:
  # Postgres is the chosen database (see README "Why Postgres").
  url: "postgres://postgres:postgres@localhost:5432/base_backend"
  max_connections: 10
  run_migrations: true

jwt:
  secret: "dev-secret-change-me-in-production"
  issuer: "base_rust_backend"
  access_ttl_minutes: 30
  refresh_ttl_days: 30

email:
  smtp_host: "localhost"
  smtp_port: 1025
  smtp_user: ""
  smtp_password: ""
  smtp_tls: false          # STARTTLS/implicit TLS; false for a local dev relay (e.g. MailHog)
  from_address: "no-reply@example.com"
  from_name: "Base Backend"
  # If true, register() does NOT issue tokens until the email code is confirmed.
  confirm_email_before_auth: true
  worker_interval_secs: 10
  max_send_attempts: 5

firebase:
  # Web API key, used for REST verification of Firebase ID tokens.
  api_key: ""
  project_id: ""
  # Path to the service-account JSON used to send FCM messages.
  service_account_path: ""

notifications:
  worker_interval_secs: 10
  max_send_attempts: 5

i18n:
  default_language: "en"
  supported: ["en", "ru", "sr"]
